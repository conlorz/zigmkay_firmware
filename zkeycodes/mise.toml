[tasks.build]
description = "Compile the Zig HJSON converter into root zig-out"
run = 'zig build install -j"$ZIGMKAY_BUILD_JOBS" -p ../zig-out'

[tasks.test]
description = "Run keycode generation and label tests"
run = 'zig build test -j"$ZIGMKAY_BUILD_JOBS"'

[tasks.check-generated]
description = "Check committed keycodes without updating them"
run = 'zig build check-generated -j"$ZIGMKAY_BUILD_JOBS"'

[tasks.convert]
description = "Explicit HJSON conversion; paths relative to zkeycodes"
run = 'zig build convert -j"$ZIGMKAY_BUILD_JOBS" --'

[tasks.convert-all]
description = "Explicitly regenerate committed keycodes"
run = 'zig build convert-all -j"$ZIGMKAY_BUILD_JOBS"'

[tasks.check-firmware-target]
description = "Verify host generators with a firmware target selected"
run = 'zig build test -j"$ZIGMKAY_BUILD_JOBS" -Dtarget=thumb-freestanding-eabi'
